[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auriga"
version = "0.1.0"
description = "AURIGA - Autonomous Quant Research & Investment Agent (Alpaca Hackathon 2026)"
readme = "README.md"
requires-python =">=3.11,<4.0.0"
dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
    "pandas>=2.0",
    "numba>=0.59",
    "xgboost>=2.0",
    "scipy>=1.11",
    "alpaca-py>=0.20",
    "streamlit>=1.32",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# N803/N806 : conventions de nommage héritées des modules portés de midasV3
# (variables type "RSI", "MACD" dans les fonctions Numba) — non bloquant.
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# app.py : sys.path hack volontaire pour lancer streamlit sans installation
"src/auriga/dashboard/app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]